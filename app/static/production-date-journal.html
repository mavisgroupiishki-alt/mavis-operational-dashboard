<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Журнал подтверждения дат · MAVIS</title><style>body{font:15px system-ui,sans-serif;background:#f4f8f9;color:#294659;margin:0;padding:32px}main{max-width:1250px;margin:auto;background:white;border:1px solid #dbe8ea;padding:28px;border-radius:20px}table{border-collapse:collapse;width:100%}td,th{padding:13px;text-align:left;border-bottom:1px solid #e1ebee}th{background:#eff7f7}a{color:#057884}small{color:#70808c}#error{color:#af3344}button{border:1px solid #a7cbd0;background:white;padding:8px 14px;border-radius:10px;cursor:pointer}</style></head><body><main><a href="/#production">← Вернуться в производство</a><h1>История подтверждений дат закрытия</h1><p><small>Показывает только переходы через специальную форму. Прямые изменения в Bitrix24 НЕ отражаются в этом журнале.</small></p><button onclick="load()">Обновить</button><p id="error"></p><div style="overflow:auto"><table><thead><tr><th>Время UTC</th><th>Сделка</th><th>Сотрудник (ID)</th><th>Было</th><th>Стало</th><th>Смена стадии</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
let esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(){try{let r=await fetch('/api/production-date/journal',{credentials:'same-origin'}),j=await r.json();if(!r.ok)throw Error(j.detail||'Нет доступа');document.querySelector('#error').textContent='';document.querySelector('#rows').innerHTML=j.rows.length?j.rows.map(x=>`<tr><td>${esc(x.confirmed_at)}</td><td><b>${esc(x.title)}</b><br><small>№ ${esc(x.deal_id)}</small></td><td>${esc(x.user_id)}</td><td>${esc(x.old_date||'нет')}</td><td>${esc(x.new_date)}${x.date_changed?'':' (подтверждена)'}</td><td>${esc(x.old_stage)} → ${esc(x.new_stage)}</td></tr>`).join(''):'<tr><td colspan="6">Подтверждений ещё нет</td></tr>'}catch(e){document.querySelector('#error').textContent=e.message}}load();
</script></body></html>
