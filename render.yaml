services:
  - type: web
    name: mavis-operational-dashboard
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: TIMEZONE
        value: Europe/Minsk
      - key: REFRESH_SECONDS
        value: "300"
      - key: DATA_DIR
        value: /var/data
      - key: BITRIX_WEBHOOK
        sync: false
      - key: BITRIX_EVENT_TOKEN
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: VIEW_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CLEAN_REVENUE_URL
        sync: false
      - key: CLEAN_REVENUE_TOKEN
        sync: false
      - key: JARVIS_OPERATIONS_URL
        sync: false
      - key: JARVIS_OPERATIONS_TOKEN
        sync: false
