services:
  - type: web
    name: mavis-operational-dashboard
    runtime: docker
    region: frankfurt
    healthCheckPath: /health
    disk:
      name: mavis-dashboard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TIMEZONE
        value: Europe/Minsk
      - key: REFRESH_SECONDS
        value: "60"
      - key: DATA_DIR
        value: /var/data
      - key: BITRIX_WEBHOOK
        sync: false
      - key: BITRIX_EVENT_TOKEN
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: VIEW_PASSWORD
        sync: false
